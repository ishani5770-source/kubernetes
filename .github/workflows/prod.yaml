name: demo
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  credentials_build_deploy:
    name: Building and Pushing the Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::762989750451:role/github-actions-fresh-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: eks-repo
        run: |
          IMAGE_TAG=$(git rev-parse --short "$GITHUB_SHA")
          ENV=prod
          BRANCH=${GITHUB_REF##*/}
          
          docker build -f Dockerfile-$ENV --build-arg ARG_ENV=${ENV} -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH-$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH-$IMAGE_TAG
          
          # Direct file path update
          sed -i "s|CHANGE-IMAGE-NAME|$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH-$IMAGE_TAG|g" manifest/prod/deployment.yaml

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name eks-cluster

      - name: Deploy to EKS with Customization
        run: |
          kubectl config use-context arn:aws:eks:us-east-1:762989750451:cluster/eks-cluster
          kubectl apply -f manifest/prod/namespace.yaml
          kubectl apply -f manifest/prod/deployment.yaml
          kubectl apply -f manifest/prod/service.yaml
          kubectl apply -f manifest/prod/ingress.yaml
          kubectl get svc -n demo
